quarkus.http.host=127.0.0.1
quarkus.s3.devservices.enabled=false
quarkus.s3.endpoint-override=${STACKEMU_ENDPOINT:http://localhost:4566}
quarkus.s3.aws.region=${STACKEMU_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${STACKEMU_ACCESS_KEY:test}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${STACKEMU_SECRET_KEY:test}
quarkus.s3.path-style-access=true
quarkus.s3.sync-client.type=url
quarkus.s3.api-call-timeout=3S
quarkus.s3.api-call-attempt-timeout=2S
stackemu.page-size=${STACKEMU_PAGE_SIZE:50}
stackemu.max-upload=${STACKEMU_MAX_UPLOAD:10485760}
quarkus.http.limits.max-body-size=${STACKEMU_HTTP_MAX_BODY:11M}
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.body.uploads-directory=${java.io.tmpdir}/stackemu-uploads
quarkus.rest-csrf.cookie-http-only=true
stackemu.operations.path=${STACKEMU_OPERATIONS_PATH:.stackemu/operations}
stackemu.operations.max-storage=${STACKEMU_OPERATIONS_MAX_STORAGE:268435456}
stackemu.operations.retention-days=${STACKEMU_OPERATIONS_RETENTION_DAYS:30}
stackemu.operations.page-size=${STACKEMU_OPERATIONS_PAGE_SIZE:100}
stackemu.operations.max-transfer=${STACKEMU_OPERATIONS_MAX_TRANSFER:67108864}
stackemu.operations.call-timeout=${STACKEMU_OPERATIONS_CALL_TIMEOUT:PT30S}
%test.stackemu.operations.path=target/test-operations
