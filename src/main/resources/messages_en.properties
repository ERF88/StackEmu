contractActions=Native buttons: Enter/Space. Links: Enter. Tab exposes visible focus; disabled buttons are skipped. Hover is supplementary, never the only feedback.
contractStatus=Status uses polite announcements; alerts communicate errors. Text and icons accompany color. All values on this page are illustrative, not emulator health.
contractLoading=aria-busy belongs to the updated content; loading text stays outside that busy region. Do not announce a guessed percentage.
contractEmpty=Explain the empty result and offer a real, safe next link. Navigating to a form is not a mutation.
contractTable=Named scroll region: Tab to focus, arrow keys to scroll. Captions and row/column headers preserve table semantics; object keys stay verbatim.
contractFields=Associate every field with a label and its help/error text. Checkbox: Space. Read-only values remain selectable; errors are not conveyed by color alone.
