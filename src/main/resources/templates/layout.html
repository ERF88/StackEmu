<!doctype html>
<html lang="{ui.language}" data-theme="{ui.theme}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false}'>
    <title>StackEmu · S3</title>
    <link rel="stylesheet" href="/app.css?v=workspace1">
    <script src="/vendor/htmx.min.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#content">{ui.text('skip')}</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="{ui.text('navigation')}">
        <a class="brand" href="/?{ui.query}"><span class="brand-mark" aria-hidden="true">S</span>StackEmu</a>
        <p class="nav-caption">{ui.text('workspace')}</p>
        <nav class="primary-navigation" aria-label="{ui.text('navigation')}">
          <a href="/?{ui.query}" {#if ui.page == '/'}aria-current="page"{/if}><span aria-hidden="true">◫</span>{ui.text('dashboard')}</a>
          <a href="/?{ui.query}#bucket-panel" {#if ui.page.startsWith('/s3')}aria-current="page"{/if}><span aria-hidden="true">▱</span>S3 · Buckets</a>
          <a href="/connection?{ui.query}" {#if ui.page == '/connection'}aria-current="page"{/if}><span aria-hidden="true">◎</span>{ui.text('connection')}</a>
        </nav>
        <div class="sidebar-bottom">
          <a href="/components?{ui.query}">{ui.text('components')}</a>
          <p>{ui.text('local')}</p>
        </div>
      </aside>
      <div class="workspace">
      <header class="workspace-header">
        <span class="workspace-label">{ui.text('workspace')} <small>/ S3</small></span>
        <div class="preferences">
          <a href="{ui.english}" lang="en">English</a>
          <a href="{ui.portuguese}" lang="pt-BR">Português</a>
          <a href="{ui.toggleTheme}">{ui.text('theme')}</a>
        </div>
      </header>
      <main id="content" tabindex="-1">
        {#insert content /}
      </main>
      <footer>{ui.text('local')}</footer>
      </div>
    </div>
  </body>
</html>
