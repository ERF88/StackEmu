{#include layout}
  {#title}{message}{/title}
  {#content}
    <section class="resource-panel resource-state" role="alert">
      <h1 class="error">{#include icons/error /}{message}</h1>
      <a class="button" href="/s3?{ui.query}">{#include icons/back /}{ui.text('backToS3')}</a>
      <a class="button" href="/connection?{ui.query}">{#include icons/connection /}{ui.text('connectionDetails')}</a>
    </section>
  {/content}
{/include}
