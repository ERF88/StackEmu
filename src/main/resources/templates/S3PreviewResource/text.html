{#include layout}
  {#title}{ui.text('textPreview')}{/title}
  {#content}
    <h1>{ui.text('textPreview')}</h1>
    <p>{ui.text('targetBucket')}: <code>{view.bucket}</code></p>
    <h2 class="object-key">{view.key}</h2>
    <p>{view.message}</p>
    {#if view.available}
      <pre class="text-preview" tabindex="0" role="region" aria-label="{ui.text('previewContent')}"><code>{view.text}</code></pre>
    {/if}
    <nav class="preview-navigation" aria-label="{ui.text('objectActions')}">
      <a class="button primary" href="{view.downloadHref}">{ui.text('download')}</a>
      <a href="{view.objectHref}">{ui.text('backToDetails')}</a>
    </nav>
  {/content}
{/include}
