<div class="density-controls" role="group" aria-label="{ui.text('densityPreferences')}">
  <a href="{ui.densityLink('comfortable')}" data-density-choice="comfortable" {#if ui.density == 'comfortable'}aria-current="true"{/if}>{ui.text('densityComfortable')}</a>
  <a href="{ui.densityLink('compact')}" data-density-choice="compact" {#if ui.density == 'compact'}aria-current="true"{/if}>{ui.text('densityCompact')}</a>
</div>
