{#include layout}
  {#content}
    <h1>{ui.text('dashboard')}</h1>
    <p>{ui.text('scope')}</p>
    <a class="button" href="/s3/write?action=bucket&amp;{ui.query}">{ui.text('createBucket')}</a>
    <a
      class="button"
      href="/?{ui.query}"
      hx-get="/buckets?{ui.query}"
      hx-target="#bucket-panel"
      hx-swap="outerHTML"
      hx-indicator="#loading"
    >{ui.text('refresh')}</a>
    <span id="loading" class="htmx-indicator" aria-hidden="true">…</span>
    {#include BucketsResource/buckets /}
  {/content}
{/include}
