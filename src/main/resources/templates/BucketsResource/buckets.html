<section id="bucket-panel" aria-live="polite" aria-atomic="true">
  {#if connected}
    <p class="status">● {ui.text('connected')}</p>
    <h2>Buckets</h2>
    {#if buckets.isEmpty}
      <p>{ui.text('empty')}</p>
    {#else}
      <table>
        <thead>
          <tr><th scope="col">{ui.text('name')}</th></tr>
        </thead>
        <tbody>
          {#for bucket in buckets}
            <tr><td><a href="{ui.bucketLink(bucket)}">{bucket}</a></td></tr>
          {/for}
        </tbody>
      </table>
    {/if}
    <p>{ui.text('next')}</p>
  {#else}
    <h2 class="error">{ui.text('unavailable')}</h2>
    <p>{ui.text('diagnostic')}</p>
    <a href="/connection?{ui.query}">{ui.text('connection')}</a>
  {/if}
</section>
