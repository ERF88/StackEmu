imagePreview=Prévia de imagem
previewImageNote=Somente PNG/JPEG estáticos: entrada e saída PNG até 1 MiB, eixos até 4096 e 4.000.000 pixels. Reencodada sem metadados da origem; orientação e cores podem diferir. O download original não muda.
previewImageFallback=A imagem é validada em uma requisição separada. Se não puder ser exibida, baixe o anexo original ou volte aos detalhes. Esta página não confirma a disponibilidade do objeto.
previewImageLoading=Carregando e validando imagem…
previewImageReady=Imagem reencodada carregada. O anexo original continua disponível abaixo.
previewImageFailed=Prévia de imagem indisponível ou recusada. Baixe o anexo original ou volte aos detalhes.
previewImageAlt=Prévia de imagem do objeto; se indisponível, use o download do anexo original abaixo.
previewImageUnsupported=Prévia de imagem indisponível: extensão, MIME ou encoding não suportado. Use PNG/image/png ou JPG/JPEG/image/jpeg estáticos sem compressão.
previewImageTooLarge=Prévia de imagem indisponível: entrada acima de 1 MiB. Nenhuma imagem parcial é exibida.
previewImageInvalid=Prévia recusada: imagem inválida, animada, truncada, formato conflitante, dados extras ou dimensões/saída acima dos limites. Baixe o anexo original.
previewContent=Texto escapado do objeto
backToDetails=Voltar aos detalhes do objeto
previewTextNote=Texto UTF-8 completo, limitado a 64 KiB. JSON exibido verbatim, sem validar sintaxe. Markup e links não são interpretados. O download preserva o arquivo original.
previewUnsupported=Prévia de texto indisponível para este formato, metadados ou encoding. Suportados: .txt/.log com text/plain ou .json com application/json, somente UTF-8 e sem compressão. Use a prévia de imagem para PNG/JPEG suportados ou baixe o anexo original; documentos ativos não são renderizados.
previewTooLarge=Prévia indisponível: objeto acima de 64 KiB. Nenhum conteúdo parcial é exibido. Baixe o arquivo original como anexo.
previewInvalidText=Prévia indisponível: UTF-8 inválido ou caracteres de controle não suportados. Baixe o arquivo original como anexo.
copyFailed=Clipboard indisponível ou negado. O texto está selecionado para cópia manual.
