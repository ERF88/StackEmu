navigation=Navegação principal
galleryReadonly=Prévia somente leitura
contractDisclosure=Painel nativo: Enter/Espaço expande ou recolhe; Tab move o foco sem prendê-lo. Prévias permitem seleção/cópia, nunca execução de comandos.
galleryActions=Ações e estados de interação
galleryInteraction=Controles ilustrativos: experimente hover e foco por teclado. O botão de exemplo não executa operações.
