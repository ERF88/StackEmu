contractActions=Botões nativos: Enter/Espaço. Links: Enter. Tab mostra foco visível; botões desabilitados são ignorados. Hover é complementar, nunca o único feedback.
contractStatus=Status usa anúncio educado; alertas comunicam erros. Texto e ícones acompanham a cor. Os valores desta página são ilustrativos, não a saúde do emulador.
contractLoading=aria-busy pertence ao conteúdo atualizado; o texto de carregamento fica fora dessa região ocupada. Não anunciar porcentagem estimada.
contractEmpty=Explique o resultado vazio e ofereça um link real para a próxima ação segura. Navegar até o formulário não é uma mutação.
contractTable=Região rolável rotulada: Tab para focar, setas para rolar. Captions e cabeçalhos preservam a semântica; chaves permanecem integrais.
contractFields=Associe rótulo e ajuda/erro a cada campo. Checkbox: Espaço. Valores somente leitura continuam selecionáveis; erros não dependem apenas da cor.
loading=Carregando…
submitting=Enviando… Aguarde o resultado antes de tentar novamente.
refreshFailed=Falha ao atualizar. O resultado anterior continua exibido; tente novamente ou recarregue a página.
fileReselect=Se a validação falhar, selecione o arquivo novamente antes de reenviar.
pagination=Paginação de objetos
objectActions=Ações do objeto
