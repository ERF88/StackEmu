accessDenied=O emulador negou a operação. Verifique as permissões configuradas.
unsupportedOperation=A operação não é suportada pelo emulador configurado.
invalidRequest=O bucket, a chave do objeto ou o parâmetro de paginação é inválido.
operationFailed=A operação falhou. Tente novamente ou verifique o status do emulador.
deleteObject=Excluir objeto
deleteReview=Revisar alvo exato
deleteWarning=Esta ação exclui permanentemente apenas o objeto exibido, não uma pasta ou bucket. A confirmação expira em cinco minutos e só pode ser usada uma vez.
deleteConcurrency=Não altere o versionamento do bucket externamente durante a operação. A verificação de ETag não distingue substituições com o mesmo ETag.
deleteConsent=Entendo que esta ação não pode ser desfeita e confirmo a exclusão deste objeto exato.
deleteCapacity=Muitas confirmações pendentes. Aguarde cinco minutos e revise o objeto novamente.
deleteExpired=Confirmação expirada, já utilizada ou inválida. Nenhuma nova exclusão foi enviada. Revise o objeto novamente.
deleteUnsafe=Exclusão indisponível para este alvo: é necessário verificar que o versionamento nunca foi ativado; markers de pasta e nomes não suportados são excluídos.
deleteConflict=O objeto mudou ou houve conflito com outra operação. Revise o objeto atual antes de tentar novamente.
deleteMissing=Bucket ou objeto não encontrado. Atualize a lista.
deleteForbidden=A permissão para verificar ou excluir este objeto foi negada. Não houve nova tentativa automática.
deleteUnavailable=Não foi possível verificar o alvo. Nenhuma exclusão foi enviada.
deleteUncertain=Não foi possível confirmar o resultado da exclusão. Uma alteração pode ter ocorrido. Inspecione o recurso antes de nova tentativa manual; esta confirmação não pode ser reutilizada.
deleteCompleted=O emulador confirmou a solicitação de exclusão condicional deste objeto exato.
