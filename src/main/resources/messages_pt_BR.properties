invalidBucketName=Use 3–63 letras minúsculas, números ou hífens; inicie/termine com letra ou número; prefixos/sufixos reservados S3 não são permitidos. Pontos não são aceitos para escritas nesta política inicial.
invalidObjectKey=Informe uma chave não vazia de até 1024 bytes UTF-8, sem caracteres de controle.
invalidPrefix=Informe um prefixo não vazio de até 1024 bytes UTF-8 incluindo a barra final, sem caracteres de controle.
uploadLimit=O arquivo excede o limite de upload configurado.
