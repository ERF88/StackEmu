uploadNamePolicy=A chave será o prefixo atual mais o nome original do arquivo selecionado, incluindo a extensão. O tipo é preservado quando disponível; tipos desconhecidos usam um fallback seguro.
invalidFilename=Selecione um arquivo com nome válido. Prefixo e nome juntos devem ter até 1024 bytes UTF-8 e não conter caracteres de controle.
