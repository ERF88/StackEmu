name: Build and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.12.0 hadolint Dockerfile tools/ux0/Dockerfile
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - run: docker compose config --quiet
      - shell: pwsh
        run: |
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Path work/modules -Force
          ./scripts/check-style.ps1
  verify:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d ministack --wait
      - run: docker run --rm --network host -v "$PWD:/build" -w /build -e STACKEMU_INTEGRATION=true maven:3.9.11-eclipse-temurin-25 mvn -B -ntp clean verify
      - run: docker run --rm -v "$PWD:/workspace" -w /workspace node:24.10.0 npm run spike:css
      - run: docker compose up --build -d --wait
      - shell: pwsh
        run: ./scripts/verify-container.ps1
      - shell: pwsh
        run: ./scripts/smoke.ps1
      - shell: pwsh
        run: ./scripts/verify-writes.ps1
      - run: docker run --rm --ipc=host --network host -e STACKEMU_BROWSER_HOST_NETWORK=true -v "$PWD:/repo" -w /repo mcr.microsoft.com/playwright:v1.64.1-noble bash -lc "npm ci --ignore-scripts --no-audit --no-fund && node scripts/run-browser-local.mjs"
      - run: docker run --rm --ipc=host --network host -v "$PWD:/repo" -w /repo mcr.microsoft.com/playwright:v1.64.1-noble node tools/ux0/check.mjs
      - run: docker compose -f compose.yaml -f compose.streaming-test.yaml up -d --no-deps gui
      - shell: pwsh
        run: ./scripts/verify-streaming.ps1
      - shell: pwsh
        run: ./scripts/scan-image.ps1 -RequireClean
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: stackemu-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/bom.json
            target/bom.xml
            work/release/vulnerabilities.json
            work/release/scan-summary.json
            work/browser-report.json
            work/browser-results/
            work/ux0/*.json
            work/ux0/*.png
            work/ux0/license-*.txt
      - if: always()
        run: docker compose logs && docker compose down
