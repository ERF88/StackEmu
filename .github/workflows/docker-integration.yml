name: StackEmu Docker integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the StackEmu image
        run: docker build -t stackemu:local .

      - name: Preload the unhealthy replacement image for rollback testing
        run: |
          context="$RUNNER_TEMP/stackemu-unhealthy-image"
          mkdir -p "$context"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          FROM stackemu:local
          HEALTHCHECK --interval=1s --timeout=1s --retries=1 CMD exit 1
          DOCKERFILE
          docker build --network=none --tag stackemu:offline-unhealthy-test "$context"

      - name: Run CLI unit tests and cache dependencies
        working-directory: stackemu-cli
        env:
          STACKEMU_DOCKER_INTEGRATION: 'false'
          STACKEMU_AWS_CLI_INTEGRATION: 'false'
        run: mvn -B -ntp test

      - name: Install AWS CLI v2
        run: |
          curl --fail --silent --show-error --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            --output "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          if [[ -d /usr/local/aws-cli ]]; then
            sudo "$RUNNER_TEMP/aws/install" --update
          else
            sudo "$RUNNER_TEMP/aws/install"
          fi
          aws --version

      - name: Check AWS CLI contract script syntax
        run: bash -n scripts/aws-contract.sh

      - name: Confirm the StackEmu image is preloaded
        run: docker image inspect stackemu:local >/dev/null

      - name: Block container egress and guard Docker pulls
        run: |
          real_docker="$(command -v docker)"
          wrapper_directory="$RUNNER_TEMP/stackemu-offline-bin"
          forbidden_commands="$RUNNER_TEMP/stackemu-forbidden-docker-commands.log"
          chain="STACKEMU-OFFLINE"
          bridge_subnet="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Subnet}}')"
          mkdir -p "$wrapper_directory"
          : > "$forbidden_commands"

          cat > "$wrapper_directory/docker" <<'DOCKER_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          real_docker="${STACKEMU_REAL_DOCKER:?}"
          forbidden_commands="${STACKEMU_FORBIDDEN_DOCKER_COMMANDS:?}"
          first="${1:-}"
          second="${2:-}"
          if [[ "$first" == "pull" || "$first" == "build" || "$first" == "compose" \
            || ( "$first" == "image" && ( "$second" == "pull" || "$second" == "build" ) ) \
            || ( "$first" == "buildx" && "$second" == "build" ) ]]; then
            printf '%s %s\n' "$first" "$second" >> "$forbidden_commands"
            printf 'Docker pull/build is forbidden during offline startup.\n' >&2
            exit 97
          fi
          if [[ "$first" == "run" || "$first" == "create" \
            || ( "$first" == "container" && ( "$second" == "run" || "$second" == "create" ) ) ]]; then
            has_preloaded_image=false
            for argument in "$@"; do
              if [[ "$argument" == "--pull" || "$argument" == --pull=* ]]; then
                printf 'run %s\n' "$argument" >> "$forbidden_commands"
                printf 'Docker pull policy is forbidden during offline startup.\n' >&2
                exit 97
              fi
              if [[ "$argument" == "stackemu:local" ]]; then
                has_preloaded_image=true
              fi
            done
            if [[ "$has_preloaded_image" != true ]]; then
              printf 'Offline startup must use the preloaded stackemu:local image.\n' >&2
              exit 98
            fi
            if ! "$real_docker" image inspect stackemu:local >/dev/null 2>&1; then
              printf 'The preloaded stackemu:local image is missing.\n' >&2
              exit 98
            fi
          fi
          exec "$real_docker" "$@"
          DOCKER_WRAPPER
          chmod +x "$wrapper_directory/docker"
          bash -n "$wrapper_directory/docker"

          sudo iptables -nL DOCKER-USER >/dev/null
          sudo iptables -N "$chain"
          sudo iptables -A "$chain" -d "$bridge_subnet" -j RETURN
          sudo iptables -A "$chain" -j REJECT
          sudo iptables -I DOCKER-USER 1 -i docker0 -j "$chain"

          echo "STACKEMU_REAL_DOCKER=$real_docker" >> "$GITHUB_ENV"
          echo "STACKEMU_FORBIDDEN_DOCKER_COMMANDS=$forbidden_commands" >> "$GITHUB_ENV"
          echo "STACKEMU_OFFLINE_EGRESS_CHAIN=$chain" >> "$GITHUB_ENV"
          echo "$wrapper_directory" >> "$GITHUB_PATH"

      - name: Run the sandbox contract with networking disabled
        working-directory: stackemu-cli
        env:
          STACKEMU_DOCKER_INTEGRATION: 'true'
          STACKEMU_AWS_CLI_INTEGRATION: 'true'
          STACKEMU_UNHEALTHY_TEST_IMAGE: stackemu:offline-unhealthy-test
        run: |
          mvn -o -B -ntp -Dtest=SandboxLifecycleIntegrationTest test
          if [[ -s "$STACKEMU_FORBIDDEN_DOCKER_COMMANDS" ]]; then
            cat "$STACKEMU_FORBIDDEN_DOCKER_COMMANDS"
            exit 1
          fi
          rejected_packets="$(sudo iptables -nvx -L "$STACKEMU_OFFLINE_EGRESS_CHAIN" \
            | awk '$3 == "REJECT" { total += $1 } END { print total + 0 }')"
          if [[ "$rejected_packets" != "0" ]]; then
            printf 'The sandbox attempted %s outbound packet(s) while offline.\n' "$rejected_packets"
            exit 1
          fi

      - name: Remove the temporary egress firewall rule
        if: always()
        run: |
          sudo iptables -D DOCKER-USER -i docker0 -j STACKEMU-OFFLINE 2>/dev/null || true
          sudo iptables -F STACKEMU-OFFLINE 2>/dev/null || true
          sudo iptables -X STACKEMU-OFFLINE 2>/dev/null || true
          docker image rm stackemu:offline-unhealthy-test 2>/dev/null || true
