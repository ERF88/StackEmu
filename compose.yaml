services:
  ministack:
    image: ministackorg/ministack:1.5.25
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
    volumes:
      - ministack-state:/tmp/ministack-state
      - ministack-s3:/tmp/ministack-data/s3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  gui:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STACKEMU_ENDPOINT: http://ministack:4566
    depends_on:
      ministack:
        condition: service_healthy
volumes:
  ministack-state:
  ministack-s3:
